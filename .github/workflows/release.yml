name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      # Si el secreto SG_FLAG_LIST no existe en tu Fork, se crea un archivo dummy para evitar que el build falle
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            echo "SG_FLAG_LIST secret no detectado, usando archivo existente o creando stub..."
            mkdir -p tweak/Sources/Shared/Flags
            [ -f tweak/Sources/Shared/Flags/SGFlagList.m ] || touch tweak/Sources/Shared/Flags/SGFlagList.m
          fi

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

      - name: Upload Artifacts (.deb & .dylib)
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-build
          path: |
            tweak/packages/*.deb
            tweak/.theos/obj/debug/*.dylib
            tweak/.theos/obj/*.dylib
